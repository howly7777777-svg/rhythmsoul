      <h1>Rhythm Soul</h1>
      <p class="tag" data-zh="每天練一件事。島會記住。" data-en="Practice one thing a day. The island remembers."></p>
      <p class="lede" data-zh="寫下你想變好的那件事，立刻練十分鐘。明天用你留下的那句接著練。資料只留在你的 iPhone。" data-en="Name the thing you want. Practice ten minutes. Tomorrow picks up from the sentence you leave. Everything stays on your iPhone."></p>
      <a class="btn" href="https://apps.apple.com" data-zh="即將在 App Store" data-en="Coming to the App Store"></a>
    </section>

    <div class="grid">
      <article class="card">
        <h2 data-zh="一棵焦點樹" data-en="One focus tree"></h2>
        <p data-zh="一天只練現在這一步。不是地圖，不是經驗值海。" data-en="One step today. Not a quest map. Not a fake XP grind."></p>
      </article>
      <article class="card">
        <h2 data-zh="留下一句" data-en="Leave one sentence"></h2>
        <p data-zh="練完寫卡住的地方。下一步會跟著那句走。" data-en="After practice, write what got stuck. The next step follows that note."></p>
      </article>
      <article class="card">
        <h2 data-zh="本機優先" data-en="Local first"></h2>
        <p data-zh="沒有帳號。沒有雲端檔案。技能樹活在這台裝置。" data-en="No account. No cloud file. Your trees live on this device."></p>
      </article>
      <article class="card">
        <h2 data-zh="不是醫療" data-en="Not medical"></h2>
        <p data-zh="這是生活練習陪伴，不是治療、診斷或健康建議。" data-en="A practice companion. Not therapy, diagnosis, or health advice."></p>
      </article>
    </div>

    <p class="note" data-zh="18–45 歲。iPhone 與 iPad。iOS 17 以上。" data-en="Ages 18–45. iPhone and iPad. iOS 17+."></p>

    </footer>
  </div>
  <script>
    const stored = localStorage.getItem("rs.siteLang") || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
    const apply = (lang) => {
      document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
      document.querySelectorAll("[data-zh]").forEach((el) => {
        el.textContent = el.getAttribute(lang === "zh" ? "data-zh" : "data-en");
      });
      document.querySelectorAll(".lang button").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.dataset.lang === lang ? "true" : "false");
      });
      localStorage.setItem("rs.siteLang", lang);
    };
    document.querySelectorAll(".lang button").forEach((btn) => {
      btn.addEventListener("click", () => apply(btn.dataset.lang));
    });
    apply(stored === "en" ? "en" : "zh");
  </script>
</body>
</html>
