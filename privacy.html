<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy · Rhythm Soul</title>
  <meta name="description" content="Rhythm Soul privacy policy. Local-first. No account. Not medical advice.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="index.html">Rhythm Soul</a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </nav>

    <article class="hero prose" style="text-align:left">
      <p class="updated" data-zh="最後更新：2026 年 9 月 20 日" data-en="Last updated: 20 September 2026"></p>
      <h1 data-zh="隱私權政策" data-en="Privacy Policy"></h1>
      <p data-zh="Rhythm Soul（「我們」）做的是本機優先的練習陪伴 App。這份政策說明我們會碰到哪些資料、資料去哪裡。這不是醫療、心理治療或診斷工具。" data-en="Rhythm Soul (“we”) is a local-first practice companion. This page says what data the app touches and where it stays. It is not medical, therapeutic, or diagnostic advice."></p>

      <h2 data-zh="1. 沒有帳號" data-en="1. No account"></h2>
      <p data-zh="你不需要註冊。我們不營運使用者資料庫，也不把你的技能樹上傳到我們的伺服器。" data-en="You do not sign up. We do not run a user database, and we do not upload your skill trees to our servers."></p>

      <h2 data-zh="2. 留在這台裝置上的內容" data-en="2. What stays on this device"></h2>
      <p data-zh="App 用裝置上的 SwiftData 儲存練習紀錄、技能樹、精靈選擇、你寫下的那句話，以及你設定的每日時長。語言偏好存在系統的本機設定裡。今日下一步也可能寫進 App Group，好讓桌面小工具顯示同一句。" data-en="The app stores practice notes, skill trees, your spirit, the sentence you leave, and your daily time budget in SwiftData on the device. Language preference is saved in on-device settings. Today’s next step may also be written to an App Group so the widget can show the same line."></p>

      <h2 data-zh="3. 通知" data-en="3. Notifications"></h2>
      <p data-zh="若你允許通知，系統會在本機排程提醒。我們看不到通知內容的雲端副本。" data-en="If you allow notifications, reminders are scheduled on the device. We do not receive a cloud copy of that content."></p>

      <h2 data-zh="4. 健康資料（可選、可拒絕）" data-en="4. Health data (optional)"></h2>
      <p data-zh="目前版本若你在「我的」頁允許，App 可能向 Apple 健康要求睡眠、步數或心率，只用來調整本地節奏提示。這不是健康建議。資料不會用來識別你，也不會賣給任何人。你可以拒絕，練習主迴圈仍然能用。" data-en="If you allow it on the Me screen, this version may ask Apple Health for sleep, steps, or heart rate to adjust local pacing hints. That is not health advice. It is not sold and not used to identify you. You can refuse; the practice loop still works."></p>

      <h2 data-zh="5. 我們不收集的東西" data-en="5. What we do not collect"></h2>
      <ul>
        <li data-zh="姓名、電子郵件、電話（除非你自己寫信給我們）" data-en="Name, email, or phone, unless you write to us"></li>
        <li data-zh="廣告識別碼或跨 App 追蹤" data-en="Advertising identifiers or cross-app tracking"></li>
        <li data-zh="把練習筆記送到雲端做分析" data-en="Cloud analytics on your practice notes"></li>
      </ul>

      <h2 data-zh="6. 刪除" data-en="6. Deletion"></h2>
      <p data-zh="刪除 App 會一併刪除本機技能樹與筆記。沒有雲端帳號需要另外申請刪除。" data-en="Deleting the app deletes local trees and notes. There is no cloud account to request separately."></p>

      <h2 data-zh="7. 兒童" data-en="7. Children"></h2>
      <p data-zh="產品面向 18–45 歲。我們不針對兒童設計，也不會故意收集兒童資料。" data-en="The product is for ages 18–45. It is not designed for children, and we do not knowingly collect children’s data."></p>

      <h2 data-zh="8. 聯絡" data-en="8. Contact"></h2>
      <p data-zh="問題請寄 howly7777777@gmail.com。寄信時請不要在郵件裡附上健康紀錄。" data-en="Questions: howly7777777@gmail.com. Please do not attach health records to that email."></p>
    </article>

    <footer>
      <a href="index.html" data-zh="回首頁" data-en="Home"></a>
    </footer>
  </div>
  <script>
    const stored = localStorage.getItem("rs.siteLang") || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
    const apply = (lang) => {
      document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
      document.querySelectorAll("[data-zh]").forEach((el) => {
        el.textContent = el.getAttribute(lang === "zh" ? "data-zh" : "data-en");
      });
      document.querySelectorAll(".lang button").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.dataset.lang === lang ? "true" : "false");
      });
      localStorage.setItem("rs.siteLang", lang);
    };
    document.querySelectorAll(".lang button").forEach((btn) => {
      btn.addEventListener("click", () => apply(btn.dataset.lang));
    });
    apply(stored === "en" ? "en" : "zh");
  </script>
</body>
</html>
